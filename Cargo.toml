[package]
name = "rclover-nautilus"
version = "0.2.0"
edition = "2021"
rust-version = "1.84"
license = "GPL-3.0-or-later"
description = "GNOME Files extension for rclover: sync emblems and an rclover context menu"
repository = "https://github.com/cyythanapong-netizen/rclover-nautilus"
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gio = "0.20"
gdk = { package = "gdk4", version = "0.9" }

[build-dependencies]
pkg-config = "0.3"
