name: RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

# One RPM for every supported Fedora. It is built on the oldest one (44): its binary needs
# only stable library versions (glibc, GTK 4, ...), which newer Fedoras keep providing.
# The install job proves that on the newest one. There is no dist tag (.fc44) in the name,
# so the file does not look tied to one release.
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y git rpm-build make cargo rust nautilus-devel gtk4-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(rpmspec -q --srpm --qf '%{version}' nuvolo-nautilus.spec)
          name=$(rpmspec -q --srpm --qf '%{name}' nuvolo-nautilus.spec)
          mkdir -p ~/rpmbuild/SOURCES dist
          git archive --format=tar.gz --prefix=nuvolo-nautilus-$version/ -o ~/rpmbuild/SOURCES/$name-$version.tar.gz HEAD
          rpmbuild -ba --define 'dist %{nil}' nuvolo-nautilus.spec
          cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: dist/*.rpm

  install:
    needs: rpm
    strategy:
      matrix:
        fedora: ['44', '45']
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: dist

      # "nuvolo" (nuvolo-sync) is not in Fedora's repositories: install every other
      # requirement, then the package itself, and check that all its libraries load.
      - name: Install on Fedora ${{ matrix.fedora }}
        run: |
          rpm=$(ls dist/*.rpm | grep -v '\.src\.rpm$')
          dnf install -y $(rpm -qp --requires $rpm | grep -v -e '^nuvolo$' -e '^rpmlib' -e '^rtld' | sed 's/ .*//')
          rpm -i --nodeps --nosignature $rpm
          ! rpm -ql nuvolo-nautilus | grep '\.so$' | xargs ldd | grep 'not found'

  release:
    needs: install
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
